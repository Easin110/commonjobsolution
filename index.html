/* Layout: sticky green brand bar + scrollable menu strip, one routed content column; OMR-bubble motif for options and hero */
:root{
  --bg:#f2f6f1;--surface:#ffffff;--surface2:#e7f0ea;--ink:#12261d;--muted:#52685d;--line:#cfdcd4;
  --brand:#0a6b4f;--brand-ink:#ffffff;--brand-soft:#d6eadf;--accent:#e3a21a;--accent-ink:#3b2900;
  --good:#16803c;--good-bg:#e0f3e6;--bad:#bd2e2e;--bad-bg:#fbe6e4;
  --font:'Kalpurush','SolaimanLipi',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1812;--surface:#13241b;--surface2:#1a3125;--ink:#e5f0ea;--muted:#9bb3a6;--line:#264236;
  --brand:#0a6b4f;--brand-ink:#ffffff;--brand-soft:#17382b;--accent:#f0b429;--accent-ink:#2b1e00;
  --good:#4cc27a;--good-bg:#12331f;--bad:#ff8a84;--bad-bg:#3a1b1a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1812;--surface:#13241b;--surface2:#1a3125;--ink:#e5f0ea;--muted:#9bb3a6;--line:#264236;
  --brand:#0a6b4f;--brand-ink:#ffffff;--brand-soft:#17382b;--accent:#f0b429;--accent-ink:#2b1e00;
  --good:#4cc27a;--good-bg:#12331f;--bad:#ff8a84;--bad-bg:#3a1b1a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.75}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}
a{color:inherit}
h1,h2,h3{line-height:1.4;margin:0;text-wrap:balance}
h1{font-size:clamp(1.7rem,5.2vw,2.6rem);font-weight:700}
h2{font-size:clamp(1.3rem,3.6vw,1.65rem);font-weight:700}
h3{font-size:1.1rem;font-weight:600}
p{margin:0}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--brand-ink)}
.top .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.mark{flex:none;width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:system-ui,sans-serif;font-weight:800;font-size:.9rem;letter-spacing:.02em}
.brand b{display:block;font-family:system-ui,sans-serif;font-size:1.05rem;line-height:1.2;white-space:nowrap}
.brand small{display:block;font-size:.8rem;opacity:.85;line-height:1.3}
.today{font-size:.9rem;opacity:.9;text-align:right}
.menu{background:var(--surface);border-bottom:1px solid var(--line)}
.menu .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;padding-block:6px}
.menu a{flex:none;text-decoration:none;color:var(--ink);padding:6px 12px;border-radius:8px;font-size:.98rem;white-space:nowrap}
.menu a:hover{background:var(--surface2)}
.menu a.on{background:var(--brand);color:var(--brand-ink)}
.menu a.cta{border:1.5px solid var(--brand)}
.menu .who{flex:none;display:flex;align-items:center;gap:8px;padding:0 8px;white-space:nowrap}
main{padding-block:24px 56px;min-height:60vh}
.stack{display:grid;gap:28px}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec-h p{color:var(--muted);font-size:.95rem}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card.soft{background:var(--brand-soft);border-color:transparent}
.btn{font:inherit;font-size:1rem;cursor:pointer;border:1.5px solid var(--brand);background:var(--brand);color:var(--brand-ink);padding:8px 18px;border-radius:9px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.5}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--brand)}
:root[data-theme="dark"] .btn.ghost{color:#6fd9a8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.ghost{color:#6fd9a8}}
.btn.warm{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.sm{padding:4px 12px;font-size:.92rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;font-size:.85rem;padding:1px 10px;border-radius:99px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.chip.fil{cursor:pointer;font:inherit;font-size:.95rem;padding:3px 14px;color:var(--ink)}
.chip.fil.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.muted{color:var(--muted)}
.hero{display:grid;gap:24px;grid-template-columns:1.25fr .75fr;align-items:center}
.hero .lead{display:grid;gap:16px;min-width:0}
.hero p.sub{color:var(--muted);max-width:60ch}
.search{display:flex;gap:8px;flex-wrap:wrap}
.search input{flex:1 1 220px;min-width:0}
input,select{font:inherit;font-size:1rem;padding:9px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);width:100%}
.search input{width:auto}
input:focus{border-color:var(--brand)}
.sheet{background:var(--surface);border:1.5px solid var(--ink);border-radius:6px;padding:14px 16px;display:grid;gap:8px;transform:rotate(1.2deg);box-shadow:5px 5px 0 var(--brand-soft)}
.sheet .t{font-weight:700;border-bottom:1.5px dashed var(--line);padding-bottom:6px;display:flex;justify-content:space-between}
.sheet .r{display:flex;align-items:center;gap:10px}
.sheet .r>span:first-child{width:1.6em;color:var(--muted);font-size:.9rem}
.bub{flex:none;width:1.9rem;height:1.9rem;border:2px solid var(--brand);border-radius:50%;display:inline-grid;place-items:center;font-size:.95rem;line-height:1;color:var(--ink)}
:root[data-theme="dark"] .bub{border-color:#3fb985}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bub{border-color:#3fb985}}
.bub.f{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.stat{border-left:4px solid var(--accent);padding:4px 12px}
.stat b{display:block;font-size:1.7rem;line-height:1.3;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.93rem}
.q{display:grid;gap:10px}
.q .qt{font-size:1.08rem;font-weight:500}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:left;display:flex;gap:12px;align-items:center;width:100%;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
button.opt:hover{border-color:var(--brand)}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.sel .bub{background:var(--brand);color:var(--brand-ink)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.ok .bub{background:var(--good);border-color:var(--good);color:#fff}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.no .bub{background:var(--bad);border-color:var(--bad);color:#fff}
.opt span.tx{min-width:0;overflow-wrap:anywhere}
.opt em{margin-left:auto;font-style:normal;font-size:.85rem;white-space:nowrap}
.ans{background:var(--surface2);border-radius:10px;padding:10px 14px;display:grid;gap:4px}
.ans b{color:var(--good)}
.pill{display:inline-block;font-size:.85rem;padding:0 10px;border-radius:99px;font-weight:600}
.pill.g{background:var(--good-bg);color:var(--good)}
.pill.b{background:var(--bad-bg);color:var(--bad)}
.pill.n{background:var(--surface2);color:var(--muted)}
.xbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px);z-index:10;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--brand);font-size:1.15rem}
:root[data-theme="dark"] .timer{color:#6fd9a8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .timer{color:#6fd9a8}}
.timer.low{color:var(--bad)!important}
.prog{height:6px;background:var(--surface2);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--brand)}
.pal{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(40px,1fr))}
.pal button{font:inherit;font-size:.95rem;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:2px 0;cursor:pointer}
.pal button.done{background:var(--brand-soft);border-color:var(--brand)}
.pal button.cur{outline:3px solid var(--accent)}
.kv{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}

let toastT;
function toast(m,bad){const t=$('#toast');t.textContent=m;t.className='toast'+(bad?' bad':'');t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200)}
function seeded(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>(s=s*16807%2147483647)/2147483647}
function pick(n,rnd){const a=Q.map((_,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,n)}

  const u=user();
  let h=NAV.map(([r,t])=>`<a href="#${r}" class="${r===route?'on':''}">${t}</a>`).join('');
  h+=u?`<span class="who"><span>${esc(u.name)}</span><button class="btn ghost sm" data-act="logout">বের হয়ে যান</button></span>`
      :`<a href="#login" class="${route==='login'?'on':''}">লগইন</a><a href="#register" class="cta ${route==='register'?'on':''}">নিবন্ধন</a>`;

let ex=null,timerId=null,viewRec=null,route='home';

function score(qs,ans){let right=0,wrong=0,skip=0;qs.forEach((qi,j)=>{const a=ans[j];if(a==null)skip++;else if(a===Q[qi][3])right++;else wrong++});return{right,wrong,skip,total:qs.length,got:Math.max(0,right-wrong*NEG)}}
function startExam(title,k,qs,mins){
  clearInterval(timerId);
  ex={title,k,qs,mins,ans:qs.map(()=>null),cur:0,end:0,phase:'intro',confirm:false,rec:null};
  if(location.hash==='#exam')render();else location.hash='exam';
}
function tick(){
  if(!ex||ex.phase!=='run')return;
  const rem=Math.max(0,ex.end-Date.now());
  if(rem<=0){finish(true);return}
  const t=$('#timer');
  if(t){const s=Math.ceil(rem/1000);t.textContent=bn(String(Math.floor(s/60)).padStart(2,'0'))+':'+bn(String(s%60).padStart(2,'0'));t.classList.toggle('low',s<=60)}
}
function finish(auto){
  clearInterval(timerId);
  const sc=score(ex.qs,ex.ans);
  const rec={t:ex.title,k:ex.k,day:new Date().toDateString(),ts:Date.now(),qs:ex.qs,ans:ex.ans,...sc};
  const all=store.get('cjs_results',[]);all.unshift(rec);store.set('cjs_results',all.slice(0,30));
  ex.phase='done';ex.rec=rec;ex.confirm=false;
  if(route==='exam')render();
  toast(auto?'সময় শেষ! আপনার উত্তরপত্র স্বয়ংক্রিয়ভাবে জমা হয়েছে।':'আপনার উত্তরপত্র সফলভাবে জমা হয়েছে।');
}

  <p class="muted">প্রতিটি ভুল উত্তরের জন্য ${bn(NEG)} নম্বর কাটা হয়েছে।</p></div>`}

  return `<article class="card q"><div class="row"><span class="chip">${SUBJ[s]}</span>${st}</div><div class="qt">${bn(j+1)}। ${esc(q)}</div>
  <div class="opts">${o.map((t,k)=>{let cl='',em='';if(k===c){cl='ok';em=a===c?'আপনার উত্তর · সঠিক':'সঠিক উত্তর'}else if(k===a){cl='no';em='আপনার উত্তর · ভুল'}
   return `<div class="opt ${cl}"><span class="bub">${LBL[k]}</span><span class="tx">${esc(t)}</span><em>${em}</em></div>`}).join('')}</div>

const setErr=(id,m)=>{const e=$('#e-'+id);if(e)e.textContent=m||''};

 search(f){const v=f.querySelector('input').value.trim();if(!v){toast('অনুসন্ধানের জন্য কিছু লিখুন।',true);return}searchQ=v;go('search')},
 register(){

  const chk=(id,cond,m)=>{setErr(id,cond?'':m);if(!cond)bad=true};

  chk('rw',w.length>=6,'পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।');
  chk('rc',c===w&&c.length>0,'দুটি পাসওয়ার্ড মিলছে না।');
  if(bad){toast('ফর্মের ভুলগুলো ঠিক করে আবার চেষ্টা করুন।',true);return}
  store.set('cjs_acct',{phone:p,pw:hsh(w),name:n});store.set('cjs_user',{name:n,phone:p});
  toast('নিবন্ধন সফল হয়েছে। CJS-এ স্বাগতম!');go('home')},
 login(){
  const p=en(val('lp')),w=$('#lw').value,a=store.get('cjs_acct',null);let bad=false;
  setErr('lp',p?'':'মোবাইল নম্বর লিখুন।');setErr('lw',w?'':'পাসওয়ার্ড লিখুন।');if(!p||!w)return;
  if(!a||a.phone!==p||a.pw!==hsh(w)){setErr('lw','মোবাইল নম্বর বা পাসওয়ার্ড সঠিক নয়। নিবন্ধন না করে থাকলে আগে নিবন্ধন করুন।');toast('প্রবেশ করা যায়নি।',true);return}
  store.set('cjs_user',{name:a.name,phone:a.phone});toast('সফলভাবে প্রবেশ করেছেন। স্বাগতম, '+a.name+'!');go('home')}
};

/* ---------- ক্রিয়া ও রাউটার ---------- */
let pastScroll=0;
function go(r){if(location.hash==='#'+r)render(true);else location.hash=r}
function render(top){
  const h=(location.hash||'#home').slice(1);route=PAGES[h]?h:'home';
  if(route!=='results')viewRec=null;
  drawMenu(route);
  const y=window.scrollY;
  $('#app').innerHTML=PAGES[route]();
  window.scrollTo(0,top===false?y:0);
  tick();
}
const keep=()=>render(false);
const A={
 toggle(d,t){const el=document.getElementById(d.target);el.hidden=!el.hidden;t.textContent=el.hidden?'বিস্তারিত দেখুন':'বিস্তারিত লুকান'},
 logout(){store.set('cjs_user',null);toast('আপনি বের হয়ে গেছেন।');render(false)},
 subj(d){const qs=Q.map((_,i)=>i).filter(i=>Q[i][0]===d.s);startExam(SUBJ[d.s]+' — বিষয়ভিত্তিক পরীক্ষা','subject',qs,qs.length)},
 pf(d){pastF=d.s;keep()},pfgo(d){pastF=d.s;go('past-questions')},
 'start-daily'(){const n=new Date(),seed=n.getFullYear()*10000+(n.getMonth()+1)*100+n.getDate();const e=startExam('দৈনিক কুইজ — '+dateBn(n),'daily',pick(5,seeded(seed)),5)},
 'start-model'(d){const m=MODELS.find(x=>x[0]===d.m);startExam(m[1],'model',pick(m[2],Math.random),m[3])},
 begin(){ex.phase='run';ex.end=Date.now()+ex.mins*60000;clearInterval(timerId);timerId=setInterval(tick,1000);render()},
 pick(d){const i=+d.i;ex.ans[ex.cur]=ex.ans[ex.cur]===i?null:i;keep()},
 prev(){if(ex.cur>0){ex.cur--;render()}},next(){if(ex.cur<ex.qs.length-1){ex.cur++;render()}},jump(d){ex.cur=+d.i;render()},
 ask(){ex.confirm=true;keep()},cancel(){ex.confirm=false;keep()},submit(){finish(false)},
 retry(){startExam(ex.title,ex.k,ex.qs,ex.mins)},
 view(d){viewRec=+d.i;render()},back(){viewRec=null;render()}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&A[t.dataset.act])A[t.dataset.act](t.dataset,t)});
document.addEventListener('submit',e=>{const f=e.target.dataset.form;if(f&&FORMS[f]){e.preventDefault();FORMS[f](e.target)}});
window.addEventListener('hashchange',()=>render());
$('#today').textContent=dateBn(new Date(),true);
render();
</script>
